# Credentials come from .env (copy .env.example)

x-mysql: &mysql
  image: mysql:8.0
  restart: unless-stopped
  command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
  environment: &mysql-env
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    MYSQL_USER: ${DB_USER:?set DB_USER in .env}
    MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s
  networks: [lume]

x-service-env: &service-env
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  # Store front (Next.js); the browser talks only to the API Gateway
  lume-front:
    build:
      context: ../lume-front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: lume-front
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - lume-gateway
    networks: [lume]

  # Single entry point of the API
  lume-gateway:
    build: ../lume-gateway
    container_name: lume-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      CATALOG_SERVICE_URL: http://lume-catalog:5001
      ORDERS_SERVICE_URL: http://lume-orders:5002
      USERS_SERVICE_URL: http://lume-users:5003
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      lume-catalog: { condition: service_healthy }
      lume-orders: { condition: service_healthy }
      lume-users: { condition: service_healthy }
    networks: [lume]

  lume-catalog:
    build: ../lume-catalog
    container_name: lume-catalog
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: mysql-catalog
      DB_NAME: catalog_db
    depends_on:
      mysql-catalog: { condition: service_healthy }
    networks: [lume]

  lume-orders:
    build: ../lume-orders
    container_name: lume-orders
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: mysql-orders
      DB_NAME: orders_db
      CATALOG_SERVICE_URL: http://lume-catalog:5001
    depends_on:
      mysql-orders: { condition: service_healthy }
      lume-catalog: { condition: service_healthy }
    networks: [lume]

  lume-users:
    build: ../lume-users
    container_name: lume-users
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: mysql-users
      DB_NAME: users_db
    depends_on:
      mysql-users: { condition: service_healthy }
    networks: [lume]

  # One database per service; ports bound to localhost only, for SQL clients
  mysql-catalog:
    <<: *mysql
    container_name: mysql-catalog
    environment:
      <<: *mysql-env
      MYSQL_DATABASE: catalog_db
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - ../lume-catalog/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-catalog-data:/var/lib/mysql

  mysql-orders:
    <<: *mysql
    container_name: mysql-orders
    environment:
      <<: *mysql-env
      MYSQL_DATABASE: orders_db
    ports: ["127.0.0.1:3308:3306"]
    volumes:
      - ../lume-orders/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-orders-data:/var/lib/mysql

  mysql-users:
    <<: *mysql
    container_name: mysql-users
    environment:
      <<: *mysql-env
      MYSQL_DATABASE: users_db
    ports: ["127.0.0.1:3309:3306"]
    volumes:
      - ../lume-users/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-users-data:/var/lib/mysql

networks:
  lume:

volumes:
  mysql-catalog-data:
  mysql-orders-data:
  mysql-users-data:
