# Credenciais vêm do .env (copie o .env.example)

x-mysql: &mysql
  image: mysql:8.0
  restart: unless-stopped
  command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
  environment: &mysql-env
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    MYSQL_USER: ${DB_USER:?defina DB_USER no .env}
    MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s
  networks: [ecommerce]

x-service-env: &service-env
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  # Loja (Next.js); fala só com o API Gateway, pelo navegador
  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks: [ecommerce]

  # Único ponto de entrada da API
  api-gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ITENS_SERVICE_URL: http://service-itens:5001
      PEDIDOS_SERVICE_URL: http://service-pedidos:5002
      USUARIOS_SERVICE_URL: http://service-usuarios:5003
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      service-itens: { condition: service_healthy }
      service-pedidos: { condition: service_healthy }
      service-usuarios: { condition: service_healthy }
    networks: [ecommerce]

  service-itens:
    build: ./catalog
    container_name: service-itens
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: mysql-itens
      DB_NAME: itens_db
    depends_on:
      mysql-itens: { condition: service_healthy }
    networks: [ecommerce]

  service-pedidos:
    build: ./orders
    container_name: service-pedidos
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: mysql-pedidos
      DB_NAME: pedidos_db
      ITENS_SERVICE_URL: http://service-itens:5001
    depends_on:
      mysql-pedidos: { condition: service_healthy }
      service-itens: { condition: service_healthy }
    networks: [ecommerce]

  service-usuarios:
    build: ./users
    container_name: service-usuarios
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: mysql-usuarios
      DB_NAME: usuarios_db
    depends_on:
      mysql-usuarios: { condition: service_healthy }
    networks: [ecommerce]

  # Um banco por serviço; portas só em localhost, para acesso por cliente SQL
  mysql-itens:
    <<: *mysql
    container_name: mysql-itens
    environment:
      <<: *mysql-env
      MYSQL_DATABASE: itens_db
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - ./catalog/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-itens-data:/var/lib/mysql

  mysql-pedidos:
    <<: *mysql
    container_name: mysql-pedidos
    environment:
      <<: *mysql-env
      MYSQL_DATABASE: pedidos_db
    ports: ["127.0.0.1:3308:3306"]
    volumes:
      - ./orders/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-pedidos-data:/var/lib/mysql

  mysql-usuarios:
    <<: *mysql
    container_name: mysql-usuarios
    environment:
      <<: *mysql-env
      MYSQL_DATABASE: usuarios_db
    ports: ["127.0.0.1:3309:3306"]
    volumes:
      - ./users/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-usuarios-data:/var/lib/mysql

networks:
  ecommerce:

volumes:
  mysql-itens-data:
  mysql-pedidos-data:
  mysql-usuarios-data:
